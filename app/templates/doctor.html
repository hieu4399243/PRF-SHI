<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bác sĩ — Trợ lý Nha khoa SHI</title>
<style>
  :root{
    --bg:#edf0f2; --paper:#ffffff; --ink:#1a1a1a; --body:#2e2e2e; --muted:#8a8a8a;
    --teal:#0e9b8e; --teal-deep:#0b7d72; --teal-tint:#e7f4f1; --line:#e4e4e4;
    --cancel:#b23a3a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--body); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  .head{background:linear-gradient(135deg,var(--teal),var(--teal-deep)); color:#fff;
        padding:16px 20px; display:flex; align-items:center; gap:12px}
  .headLeft{display:flex;align-items:center;gap:12px}
  .headRight{margin-left:auto;display:flex;align-items:center;gap:10px}
  .avatar{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);
          display:flex;align-items:center;justify-content:center;font-size:22px}
  .head h1{font-size:16px;margin:0;font-weight:700}
  .head p{font-size:11.5px;margin:2px 0 0;opacity:.9}
  .userMenu{position:relative}
  .menuBtn{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.14);
           border:1px solid rgba(255,255,255,.4);border-radius:10px;padding:6px 10px;color:#fff;
           cursor:pointer}
  .menuBtn:hover{background:rgba(255,255,255,.24)}
  .userAvatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
              background:#fff;color:var(--teal-deep);font-weight:700;font-size:12px}
  .userText{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
  .userText b{font-size:12px;font-weight:700;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .userText span{font-size:10.5px;opacity:.9}
  .chev{font-size:10px;opacity:.9;transition:transform .2s}
  .userMenu.open .chev{transform:rotate(180deg)}
  .menuPanel{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);
             border-radius:10px;min-width:170px;padding:6px;box-shadow:0 8px 20px rgba(0,0,0,.15);
             display:none;z-index:20}
  .menuPanel.show{display:block}
  .menuItem{width:100%;text-align:left;border:0;background:#fff;color:#222;padding:8px 10px;border-radius:8px;
            cursor:pointer;font-size:12px}
  .menuItem:hover{background:#f3f5f7}
  .menuItem.danger{color:var(--cancel)}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 16px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;
        padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  h2{font-size:14px;margin:0 0 12px;color:var(--ink)}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
  select,input{font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);
               border-radius:8px;background:#fff;color:var(--body)}
  button{font:inherit;font-size:13px;padding:8px 14px;border:0;border-radius:8px;
         background:var(--teal);color:#fff;cursor:pointer}
  button:hover{background:var(--teal-deep)}
  .filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tabs button{background:#fff;color:var(--body);border:1px solid var(--line)}
  .tabs button.active{background:var(--teal);color:#fff;border-color:var(--teal)}
  .stats{display:flex;gap:12px;flex-wrap:wrap}
  .stat{background:var(--teal-tint);border-radius:10px;padding:10px 16px;min-width:110px}
  .stat b{font-size:22px;color:var(--teal-deep);display:block}
  .stat span{font-size:11px;color:var(--muted)}
  .doctorCard{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fafdfc}
  .doctorCard b{color:var(--ink)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
  .pill.confirmed{background:#e2f4f0;color:var(--teal-deep)}
  .pill.cancelled{background:#f7e4e4;color:var(--cancel)}
  .slot{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;
        border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
  .slot.free{background:#fafdfc;color:var(--muted)}
  .slot.busy{background:#fff;border-left:3px solid var(--teal)}
  .tableScroll{overflow-x:auto}
  .empty{color:var(--muted);font-size:13px;padding:16px 0}
  .hide{display:none}
  .toast{position:fixed;right:18px;bottom:18px;background:#0f1720;color:#fff;padding:10px 12px;
         border-radius:10px;font-size:12px;opacity:0;transform:translateY(8px);pointer-events:none;
         transition:opacity .2s, transform .2s;z-index:30}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.ok{background:#146c43}
  .toast.err{background:#8a2c2c}
  .btnMini{padding:4px 10px;font-size:11px;border-radius:6px}
  .btnMini.done{background:#eef1f0;color:var(--muted);cursor:default}
  .btnMini.done:hover{background:#eef1f0}
  .modalBack{position:fixed;inset:0;background:rgba(15,23,32,.45);display:flex;
             align-items:center;justify-content:center;z-index:40;padding:16px}
  /* `.hide` đứng TRƯỚC rule này và cùng độ ưu tiên (0,1,0) -> display:flex thắng
     và modal hiện thường trực. Cần selector nặng hơn để trạng thái ẩn thắng. */
  .modalBack.hide{display:none}
  .modal{background:#fff;border-radius:12px;padding:18px 20px;width:100%;max-width:420px}
  .modal h3{margin:0 0 4px;font-size:16px;color:var(--ink)}
  .modal .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
  .modal label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.03em;
               color:var(--muted);margin:10px 0 4px}
  .modal select,.modal input{width:100%}
  .modal .row{display:flex;gap:8px;align-items:center;margin-top:12px}
  .modal .row input[type="checkbox"]{width:auto}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  .modal .ghost{background:#fff;color:var(--body);border:1px solid var(--line)}
  .modal .ghost:hover{background:#f5f7f7}
  .modal.wide{max-width:660px;max-height:86vh;overflow-y:auto}
  .modalHead{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
  .modalHead .ghost{margin-left:auto;padding:4px 10px;font-size:12px;flex:none}
  .pxSection{margin-top:16px}
  .pxSection h4{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
                margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
  .linkBtn{background:none;border:0;padding:0;color:var(--teal-deep);font:inherit;
           cursor:pointer;text-decoration:underline}
  .linkBtn:hover{background:none;color:var(--teal)}
  .slotActions{display:flex;gap:8px;align-items:center;flex:none}
  .rec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .rec.top{border-color:var(--teal);background:#fafdfc}
  .recTop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rank{background:var(--teal-tint);color:var(--teal-deep);font-size:11px;font-weight:700;
        border-radius:6px;padding:1px 7px}
  .recName{font-weight:600;color:var(--ink);font-size:13px}
  .badge{font-size:10.5px;font-weight:600;border-radius:20px;padding:2px 8px;margin-left:auto}
  .badge.high{background:#fbe6e6;color:#a12b2b}
  .badge.medium{background:#fdf1dd;color:#8a5a12}
  .badge.low{background:#eef1f0;color:var(--muted)}
  .fit{font-size:12px;color:var(--body);margin-top:6px}
  .meta{font-size:11.5px;color:var(--muted)}
  .reason{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}
  .coldNote{background:#fdf3e6;border:1px solid #f0d5aa;color:#8a5a12;border-radius:8px;
            padding:9px 11px;font-size:12px;line-height:1.45;margin-bottom:10px}

  @media (max-width: 640px){
    .head{padding:14px 12px}
    .head p{display:none}
    .userText span{display:none}
    .userText b{max-width:84px}
  }
</style>
</head>
<body>

<div class="head">
  <div class="headLeft">
    <div class="avatar">🦷</div>
    <div>
      <h1>Bảng điều khiển bác sĩ — Nha khoa SHI</h1>
      <p>Xem lịch hẹn và lịch làm việc của chính bạn</p>
    </div>
  </div>
  <div class="headRight">
    <div class="userMenu" id="userMenu">
      <button class="menuBtn" id="userMenuBtn" onclick="toggleUserMenu(event)">
        <span class="userAvatar" id="userInitial">D</span>
        <span class="userText">
          <b id="whoName">...</b>
          <span id="whoRole">doctor</span>
        </span>
        <span class="chev">▾</span>
      </button>
      <div class="menuPanel" id="menuPanel">
        <button class="menuItem danger" onclick="logout()">Đăng xuất</button>
      </div>
    </div>
  </div>
</div>

<div id="main" class="wrap">
  <div class="card">
    <div class="stats" id="stats"></div>
    <div class="doctorCard" id="doctorInfo"></div>
  </div>

  <div class="tabs">
    <button id="tabList" class="active" onclick="showTab('list')">📋 Lịch hẹn của tôi</button>
    <button id="tabSched" onclick="showTab('sched')">🗓️ Lịch làm việc trong ngày</button>
  </div>

  <div id="viewList">
    <div class="card">
      <h2>Bộ lọc</h2>
      <div class="filters">
        <div><label>Ngày</label>
          <select id="fDate"><option value="">Tất cả</option></select></div>
        <div><label>Trạng thái</label>
          <select id="fStatus">
            <option value="">Tất cả</option>
            <option value="confirmed">Đã xác nhận</option>
            <option value="cancelled">Đã hủy</option>
          </select></div>
        <div><label>SĐT bệnh nhân</label>
          <input id="fPhone" placeholder="vd. 0901234567"></div>
        <div><button onclick="loadList()">Lọc</button></div>
      </div>
    </div>
    <div class="card">
      <h2>Kết quả (<span id="count">0</span> lịch)</h2>
      <div class="tableScroll">
        <table>
          <thead><tr><th>Mã</th><th>Ngày</th><th>Giờ</th><th>Bệnh nhân</th>
            <th>SĐT</th><th>Dịch vụ</th><th>Trạng thái</th><th>Kết quả</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="listEmpty" class="empty hide">Không có lịch hẹn nào khớp bộ lọc.</div>
    </div>
  </div>

  <div id="viewSched" class="hide">
    <div class="card">
      <h2>Chọn ngày</h2>
      <div class="filters">
        <div><label>Ngày</label><select id="sDate"></select></div>
        <div><button onclick="loadSched()">Xem lịch làm việc</button></div>
      </div>
    </div>
    <div class="card">
      <h2 id="schedTitle">Lịch làm việc</h2>
      <div id="slots"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- Ghi kết quả khám -> tạo 1 dòng treatment_history. Đây là nguồn dữ liệu DUY
     NHẤT lúc chạy cho gợi ý cá nhân hoá của bệnh nhân (dưới 3 lượt vẫn là
     cold-start), nên bỏ trống bảng này là màn gợi ý không bao giờ cá nhân hoá. -->
<div id="txModal" class="modalBack hide">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="txTitle">
    <h3 id="txTitle">Ghi kết quả khám</h3>
    <div class="sub" id="txSub"></div>
    <label for="txOutcome">Kết quả</label>
    <select id="txOutcome">
      <option value="success">Hoàn tất</option>
      <option value="partial">Hoàn tất một phần</option>
      <option value="failed">Không thực hiện được</option>
    </select>
    <div class="row">
      <input type="checkbox" id="txFollowup" onchange="txToggleFollowup()">
      <label for="txFollowup" style="margin:0;text-transform:none;font-size:13px;color:var(--body)">
        Hẹn tái khám</label>
    </div>
    <div id="txDueWrap" class="hide">
      <label for="txDue">Ngày tái khám</label>
      <input type="date" id="txDue">
    </div>
    <div class="actions">
      <button class="ghost" onclick="txClose()">Hủy</button>
      <button id="txSave" onclick="txSubmit()">Lưu</button>
    </div>
  </div>
</div>

<!-- Hồ sơ bệnh nhân phía nha sĩ (trigger `dentist_view`): lịch sử điều trị đã ghi
     + gợi ý dịch vụ từ chính engine của màn bệnh nhân. Dưới 3 lượt vẫn là
     cold-start — đó là lý do khối "Đã khám" nằm ngay cạnh khối gợi ý. -->
<div id="pxModal" class="modalBack hide">
  <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="pxName">
    <div class="modalHead">
      <div>
        <h3 id="pxName">Hồ sơ bệnh nhân</h3>
        <div class="sub" id="pxSub" style="margin:0"></div>
      </div>
      <button class="ghost" onclick="pxClose()">✕ Đóng</button>
    </div>
    <div id="pxBody"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const stat = (n,l) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

async function api(path){
  const r = await fetch(path, { credentials: "include" });
  if(r.status === 401) throw new Error("unauth");
  return r.json();
}

function showTab(t){
  $("tabList").classList.toggle("active", t==="list");
  $("tabSched").classList.toggle("active", t==="sched");
  $("viewList").classList.toggle("hide", t!=="list");
  $("viewSched").classList.toggle("hide", t!=="sched");
}

function showToast(text, type = "ok"){
  const t = $("toast");
  t.textContent = text;
  t.className = `toast ${type}`;
  requestAnimationFrame(() => t.classList.add("show"));
}

function hideToast(){
  $("toast").classList.remove("show");
}

function toggleUserMenu(event){
  event.stopPropagation();
  const menu = $("userMenu");
  const panel = $("menuPanel");
  const open = menu.classList.toggle("open");
  panel.classList.toggle("show", open);
}

function closeUserMenu(){
  $("userMenu").classList.remove("open");
  $("menuPanel").classList.remove("show");
}

function renderCurrentUser(user){
  $("whoName").textContent = user.username || "doctor";
  $("whoRole").textContent = (user.role || "doctor").toUpperCase();
  const username = (user.username || "doctor").trim();
  $("userInitial").textContent = username ? username[0].toUpperCase() : "D";
}

function fillMeta(meta){
  const s = meta.summary;
  $("stats").innerHTML =
    stat(s.total, "Tổng lịch") + stat(s.confirmed, "Đã xác nhận") +
    stat(s.cancelled, "Đã hủy");

  const d = meta.doctor || {};
  $("doctorInfo").innerHTML =
    `<b>${d.name || "Bác sĩ"}</b> · Mã: ${d.id || "-"}` +
    (d.dept_name ? ` · Khoa: ${d.dept_name}` : "");

  const dateOpts = (meta.dates || []).map(dv => `<option value="${dv}">${dv}</option>`).join("");
  $("fDate").innerHTML = '<option value="">Tất cả</option>' + dateOpts;
  $("sDate").innerHTML = dateOpts || '<option value="">Không có ngày</option>';
}

async function loadList(){
  const q = new URLSearchParams({
    date:$("fDate").value,
    status:$("fStatus").value,
    phone:$("fPhone").value.trim(),
  });
  const data = await api("/api/doctor/appointments?"+q);
  $("count").textContent = data.count;
  $("listEmpty").classList.toggle("hide", data.count>0);
  $("rows").innerHTML = data.appointments.map(a => `
    <tr>
      <td><b>${esc(a.code)}</b></td><td>${esc(a.date)}</td><td>${esc(a.time)}</td>
      <td>${patientLink(a)}</td><td>${esc(a.patient_phone||"")}</td>
      <td>${esc(a.department||"")}</td>
      <td><span class="pill ${esc(a.status)}">${a.status==="confirmed"?"Đã xác nhận":"Đã hủy"}</span></td>
      <td>${txCell(a)}</td>
    </tr>`).join("");
}

// Tên bệnh nhân là đường vào hồ sơ + gợi ý. Không có SĐT thì không tra được hồ sơ
// (SĐT là thứ duy nhất nối lịch hẹn với bệnh nhân) -> để chữ thường.
function patientLink(a){
  const name = esc(a.patient_name || "—");
  if(!a.patient_phone) return name;
  return `<button class="linkBtn" data-px="${esc(a.patient_phone)}">${name}</button>`;
}

// Server quyết định ghi được hay không (`can_record_treatment`) — client KHÔNG tự
// suy. Bản đầu tự đoán theo status + ngày, nên nút vẫn hiện cho lịch mang mã khoa
// cũ (ho_hap, tieu_hoa) rồi bấm vào chỉ nhận 400.
const TX_BLOCKER_LABEL = {
  da_ghi: null,                                   // hiện pill "Đã ghi" riêng
  khong_phai_cua_ban: "Của bác sĩ khác",
  chua_xac_nhan: "Đã hủy",
  chua_toi_ngay: "Chưa tới ngày",
  dich_vu_da_bo: "Dịch vụ đã ngừng",
};

function txCell(a){
  if(a.treatment_recorded) return '<span class="pill confirmed">Đã ghi</span>';
  if(!a.can_record_treatment){
    const why = TX_BLOCKER_LABEL[a.record_blocker] || "—";
    return `<span style="color:var(--muted);font-size:11px">${why}</span>`;
  }
  return `<button class="btnMini" data-tx="${esc(a.code)}"
            data-name="${esc(a.patient_name||"")}"
            data-date="${esc(a.date||"")}">Ghi kết quả</button>`;
}

let txCode = null;

document.addEventListener("click", e => {
  const tx = e.target.closest("[data-tx]");
  if(tx){ txOpen(tx.dataset.tx, tx.dataset.name, tx.dataset.date); return; }
  const px = e.target.closest("[data-px]");
  if(px) pxOpen(px.dataset.px);
});

function txOpen(code, name, date){
  txCode = code;
  $("txSub").textContent = `${code} · ${name || "bệnh nhân"} · ${date}`;
  $("txOutcome").value = "success";
  $("txFollowup").checked = false;
  $("txDue").value = "";
  txToggleFollowup();
  $("txModal").classList.remove("hide");
}

function txClose(){
  txCode = null;
  $("txModal").classList.add("hide");
}

function txToggleFollowup(){
  $("txDueWrap").classList.toggle("hide", !$("txFollowup").checked);
}

async function txSubmit(){
  if(!txCode){ txClose(); return; }   // không mở từ nút nào -> không có gì để lưu
  const followup = $("txFollowup").checked;
  const due = $("txDue").value;
  if(followup && !due){
    showToast("Cần chọn ngày tái khám.", "err");
    setTimeout(hideToast, 2600);
    return;
  }
  const btn = $("txSave");
  btn.disabled = true;
  try {
    const r = await fetch("/api/doctor/treatment", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        appointment_code: txCode,
        outcome: $("txOutcome").value,
        followup_required: followup,
        followup_due_date: followup ? due : null,
      }),
    });
    const body = await r.json();
    if(r.ok){
      showToast("Đã ghi kết quả khám.");
      txClose();
      // Cùng một lịch hẹn xuất hiện ở CẢ hai tab và ở hồ sơ bệnh nhân đang mở —
      // làm mới hết, nếu không thì slot vừa ghi vẫn mời bấm lần nữa (rồi 409).
      await Promise.all([loadList(), loadSched(), pxRefresh()]);
    } else {
      showToast(body.error || "Không ghi được kết quả.", "err");
    }
  } catch (err) {
    showToast("Lỗi kết nối: " + err.message, "err");
  } finally {
    btn.disabled = false;
    setTimeout(hideToast, 2600);
  }
}

async function loadSched(){
  const date = $("sDate").value;
  if(!date){
    $("slots").innerHTML = '<div class="empty">Chưa có ngày khả dụng.</div>';
    return;
  }
  const data = await api(`/api/doctor/schedule?date=${date}`);
  $("schedTitle").textContent = `Lịch làm việc — ${date}`;
  $("slots").innerHTML = data.slots.map(slotHTML).join("")
    || '<div class="empty">Ngày này không có khung giờ làm việc.</div>';
}

// Ghi kết quả ngay tại slot vừa khám xong: đó là thao tác tự nhiên của nha sĩ,
// và cũng là nơi duy nhất `treatment_history` có thể lớn lên trong lúc chạy.
function slotHTML(s){
  const a = s.appt;
  if(!a) return `<div class="slot free"><span><b>${esc(s.time)}</b></span><span>Trống</span></div>`;
  return `<div class="slot busy">
    <span><b>${esc(s.time)}</b> — ${patientLink(a)}
      (${esc(a.patient_phone||"—")}) · ${esc(a.department||"")}</span>
    <span class="slotActions">${txCell(a)}</span>
  </div>`;
}

// ===========================================================================
// Hồ sơ bệnh nhân + gợi ý (dentist_view)
// ===========================================================================
let pxPhone = null;

function money(n){
  if(n == null) return null;
  if(n >= 1000000) return (n/1000000).toFixed(n % 1000000 ? 1 : 0).replace(".0","") + " triệu";
  return Math.round(n/1000) + "k";
}

function priceText(item){
  const lo = money(item.price_from), hi = money(item.price_to);
  if(lo && hi) return `${lo}–${hi}`;
  if(lo) return `từ ${lo}`;
  return "liên hệ";
}

const OUTCOME_LABEL = {success:"Hoàn tất", partial:"Hoàn tất một phần",
                       failed:"Không thực hiện được"};
const URGENCY_LABEL = {high:"Cần thiết", medium:"Nên làm", low:"Tham khảo"};

function pxClose(){
  pxPhone = null;
  $("pxModal").classList.add("hide");
}

async function pxOpen(phone){
  pxPhone = phone;
  $("pxName").textContent = "Đang tải…";
  $("pxSub").textContent = phone;
  $("pxBody").innerHTML = '<div class="empty">Đang tải hồ sơ…</div>';
  $("pxModal").classList.remove("hide");
  await pxRefresh();
}

/** Tải lại hồ sơ đang mở. Không mở gì thì không làm gì — dùng sau khi ghi kết quả. */
async function pxRefresh(){
  if(!pxPhone) return;
  const phone = pxPhone;
  try {
    const r = await fetch(`/api/doctor/patient?phone=${encodeURIComponent(phone)}`,
                          { credentials: "include" });
    const body = await r.json();
    if(phone !== pxPhone) return;   // nha sĩ đã mở hồ sơ khác trong lúc chờ
    if(!r.ok){
      $("pxName").textContent = "Không xem được hồ sơ";
      $("pxBody").innerHTML = `<div class="empty">${esc(body.error || "Lỗi không rõ.")}</div>`;
      return;
    }
    pxRender(body);
  } catch (err) {
    $("pxBody").innerHTML = `<div class="empty">Lỗi kết nối: ${esc(err.message)}</div>`;
  }
}

function pxRender(d){
  const p = d.patient || {};
  $("pxName").textContent = p.name || "Bệnh nhân";
  $("pxSub").textContent = [p.phone, p.birth_year ? `sinh ${p.birth_year}` : null,
                            `${d.visit_count} lượt đã khám`,
                            `${d.appointment_count} lịch hẹn với bạn`]
                            .filter(Boolean).join(" · ");
  $("pxBody").innerHTML = pxHistoryHTML(d.treatments) + pxRecoHTML(d.recommendations);
}

function pxHistoryHTML(rows){
  const body = rows.length
    ? `<div class="tableScroll"><table>
         <thead><tr><th>Ngày</th><th>Dịch vụ</th><th>Nha sĩ</th><th>Kết quả</th>
           <th>Hẹn tái khám</th></tr></thead>
         <tbody>${rows.map(t => `<tr>
           <td>${esc(t.date)}</td><td>${esc(t.service_name)}</td><td>${esc(t.doctor)}</td>
           <td>${esc(OUTCOME_LABEL[t.outcome] || t.outcome || "—")}</td>
           <td>${esc(t.followup_due_date || "—")}</td></tr>`).join("")}</tbody>
       </table></div>`
    : `<div class="empty">Chưa có lượt khám nào được ghi nhận. Ghi kết quả ở tab
         lịch làm việc để lịch sử này lớn lên.</div>`;
  return `<div class="pxSection"><h4>Lượt điều trị đã ghi (${rows.length})</h4>${body}</div>`;
}

function pxRecoHTML(reco){
  if(!reco) return "";
  // Nói thẳng ngưỡng ra màn hình: nha sĩ nhìn card cold-start mà không biết vì sao
  // thì sẽ tưởng engine hỏng, chứ không nghĩ tới việc còn thiếu lượt khám đã ghi.
  // Đủ 3 lượt mà lịch sử chỉ có MỘT loại dịch vụ thì mọi card đều là card bù:
  // dịch vụ đã làm bị lọc vì chưa tới chu kỳ, còn đồng xuất hiện chưa có gì để
  // dựa vào. Không nói ra thì nha sĩ tưởng engine hỏng.
  const allFiller = reco.items.length && reco.items.every(i => i.is_filler);
  const note = reco.is_cold_start
    ? `<div class="coldNote">Chưa đủ 3 lượt điều trị đã ghi nên đây là gợi ý theo
         dịch vụ phổ biến, chưa cá nhân hoá.${
           reco.cold_start_note ? " " + esc(reco.cold_start_note) : ""}</div>`
    : (allFiller
      ? `<div class="coldNote">Lịch sử của bệnh nhân chưa đủ đa dạng để cá nhân hoá:
           dịch vụ đã làm thì chưa tới chu kỳ nhắc lại, nên đây vẫn là gợi ý theo
           dịch vụ phổ biến.</div>`
      : "");
  const cards = reco.items.length
    ? reco.items.map(pxCardHTML).join("")
    : `<div class="empty">${esc(reco.empty_text || "Chưa có gợi ý nào.")}</div>`;
  return `<div class="pxSection"><h4>Gợi ý dịch vụ cho bệnh nhân</h4>${note}${cards}</div>`;
}

function pxCardHTML(item, i){
  // Card cold-start / card bù không có "% phù hợp": điểm của chúng đến từ độ phổ
  // biến chung, hiện một con số ở đây sẽ đọc như mức phù hợp cá nhân.
  const fit = item.fit_percent == null
    ? `<div class="meta">${item.duration_min} phút · ${priceText(item)}</div>`
    : `<div class="fit">Phù hợp <b>${item.fit_percent}%</b>
         <span class="meta">· ${item.duration_min} phút · ${priceText(item)}</span></div>`;
  return `<div class="rec ${i === 0 && item.fit_percent != null ? "top" : ""}">
    <div class="recTop">
      <span class="rank">#${item.rank}</span>
      <span class="recName">${esc(item.name)}</span>
      <span class="badge ${esc(item.urgency)}">${esc(URGENCY_LABEL[item.urgency] || item.urgency)}</span>
    </div>
    ${fit}
    <div class="reason">${esc(item.reason_text)}</div>
  </div>`;
}

async function refreshStats(){
  const meta = await api("/api/doctor/meta");
  const s = meta.summary;
  $("stats").innerHTML =
    stat(s.total,"Tổng lịch")+stat(s.confirmed,"Đã xác nhận")+stat(s.cancelled,"Đã hủy");
}

async function logout(){
  closeUserMenu();
  try {
    await fetch("/api/logout", {
      method: "POST",
      credentials: "include",
    });
  } catch (e) {
    // Dù lỗi mạng, vẫn chuyển về login để kết thúc phiên trên UI.
  }
  showToast("Đã đăng xuất", "ok");
  setTimeout(() => {
    window.location.href = "/login";
  }, 700);
}

document.addEventListener("click", () => {
  closeUserMenu();
  hideToast();
});

window.addEventListener("load", async () => {
  try {
    const me = await fetch("/api/me", { credentials: "include" });
    if (!me.ok) {
      window.location.href = "/login";
      return;
    }
    const data = await me.json();
    if (!data.user || data.user.role !== "doctor") {
      window.location.href = "/login";
      return;
    }
    renderCurrentUser(data.user);
    const meta = await api("/api/doctor/meta");
    fillMeta(meta);
    await loadList();
    await loadSched();
  } catch (e) {
    window.location.href = "/login";
  }
});
</script>
